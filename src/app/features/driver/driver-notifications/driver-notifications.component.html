<div class="driver-page"><div class="page-head"><div><span class="eyebrow">ACTIVITY</span><h1>Notifications</h1><p>Transport updates derived from your assigned shipments.</p></div></div><div class="loading" *ngIf="loading"><span class="loader-ring"></span><b>Loading activity…</b></div><div class="shipment-list"><article class="panel" *ngFor="let s of items" style="display:flex;gap:11px;align-items:center"><div class="metric-icon purple">↗</div><div><b style="font-size:10px">{{message(s)}}</b><p style="font-size:8px;color:#817789;margin:2px 0">{{s.shipmentNumber}} · {{s.pickupCity}} → {{s.deliveryCity}}</p></div><span class="status" style="margin-left:auto">{{s.status | titlecase}}</span></article><div class="empty-card" *ngIf="!loading&&!items.length"><b>No transport activity yet</b><p>Shipment updates will appear here.</p></div></div></div>
