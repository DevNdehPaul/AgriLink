<section class="page compact-buyer-page narrow"><a class="back" routerLink="/buyer/wallet">← Wallet</a><div class="page-head"><div><span class="eyebrow">Mobile money funding</span><h1 class="title">Add money</h1><p class="subtitle">Start a Fapshi mobile-money collection and approve it on your phone.</p></div></div><div class="alert alert-error" *ngIf="error">{{error}}</div><form class="card" (ngSubmit)="submit()" *ngIf="!deposit"><div class="field"><label>Amount (FCFA)</label><input class="input" type="number" min="100" [(ngModel)]="amount" name="amount" required><div class="quick-values"><button type="button" *ngFor="let v of [10000,25000,50000,100000]" (click)="amount=v">{{money(v)}}</button></div></div><div class="field"><label>Network</label><select class="select" [(ngModel)]="medium" name="medium"><option value="mobile money">MTN Mobile Money</option><option value="orange money">Orange Money</option></select></div><div class="field"><label>Cameroon mobile number</label><input class="input" [(ngModel)]="phone" name="phone" required></div><button class="btn btn-primary full" [disabled]="busy">{{busy?'Sending request...':'Continue'}}</button></form><div class="card payment-state" *ngIf="deposit as d"><span class="badge" [class.badge-warn]="d.status==='PENDING'||d.status==='CREATED'">{{d.status}}</span><h2 *ngIf="d.status==='PENDING'||d.status==='CREATED'">Waiting for payment</h2><h2 *ngIf="d.status==='SUCCESSFUL'">Payment confirmed</h2><h2 *ngIf="d.status==='FAILED'">Payment failed</h2><h2 *ngIf="d.status==='EXPIRED'">Payment timed out</h2><p class="muted">{{money(d.amount)}} FCFA · {{d.phone}}</p><button class="btn btn-primary full" (click)="sync()" *ngIf="d.status==='CREATED'||d.status==='PENDING'">Check payment status</button><button class="btn btn-soft full" (click)="deposit=null" *ngIf="d.status==='FAILED'||d.status==='EXPIRED'">Try again</button><a class="btn btn-outline full" routerLink="/buyer/wallet">Return to wallet</a></div></section>
