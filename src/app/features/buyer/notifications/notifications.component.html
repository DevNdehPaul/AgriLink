<section class="page compact-buyer-page narrow"><div class="page-head"><div><span class="eyebrow">Activity</span><h1 class="title">Updates</h1><p class="subtitle">Generated from your real order and dispute records—no fake notification feed.</p></div></div><div class="card activity" *ngIf="activity.length"><a *ngFor="let a of activity" [routerLink]="a.link"><span class="material-symbols-outlined">notifications</span><div><b>{{a.title}}</b><p>{{a.text}}</p><small>{{a.date | date:'short'}}</small></div><span class="material-symbols-outlined">chevron_right</span></a></div><div class="empty card" *ngIf="!activity.length">No recent activity.</div></section>
