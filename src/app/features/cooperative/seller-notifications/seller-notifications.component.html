<div class="page compact-page"><div class="page-head tight"><div><div class="eyebrow">Activity</div><h1 class="title">Notifications</h1><p class="subtitle">Important changes from your real orders and shipments.</p></div></div><div class="activity-feed"><a class="activity-item" *ngFor="let o of items" [routerLink]="['/cooperative/orders',o.id]"><span class="activity-icon">{{o.status==='COMPLETED'?'✓':o.status==='IN_TRANSIT'?'⇄':'•'}}</span><div class="grow"><b>{{message(o)}}</b><small>{{o.orderNumber}} · {{o.updatedAt||o.createdAt|date:'short'}}</small></div><span class="open-arrow">›</span></a><div class="empty-state" *ngIf="!items.length"><span>✓</span><b>You're up to date</b><p>No recent activity to show.</p></div></div></div>
